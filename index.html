<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEOSUPO笘・TAR ﾎｲ8</title>
  <link rel="stylesheet" href="css/app.css?v=20261113a" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <aside class="rail" aria-label="菴懈･ｭ縺ｮ蛻・ｊ譖ｿ縺・>
    <nav class="tabs">
      <button type="button" data-tab="layout" class="active" title="髢灘叙險ｭ螳・>髢灘叙</button>
      <button type="button" data-tab="items" title="繧｢繧､繝・Β驟咲ｽｮ">驟咲ｽｮ</button>
      <button type="button" data-tab="power" title="驟埼崕邂｡逅・>驟埼崕</button>
      <button type="button" data-tab="env" title="迺ｰ蠅・ｨ育判">迺ｰ蠅・/button>
      <button type="button" data-tab="present" title="蝣ｱ蜻翫・險ｭ螳・>蝣ｱ蜻・/button>
    </nav>
    <button id="help" type="button" class="rail-help" title="謫堺ｽ懆ｪｬ譏・>繝倥Ν繝・/button>
  </aside>
  <header class="top">
    <div class="brand">
      <span class="product">NEOSUPO STAR <small>ﾎｲ8</small></span>
    </div>
    <label class="plan-field">繝励Λ繝ｳ
      <input id="plan-name" type="text" aria-label="繝励Λ繝ｳ蜷・ />
    </label>
    <button id="detail" type="button">繝励Λ繝ｳ隧ｳ邏ｰ</button>
    <button id="plan-list" type="button">繝励Λ繝ｳ荳隕ｧ</button>
    <span class="spacer"></span>
    <button id="import-excel" type="button">Excel隱ｭ霎ｼ</button>
    <button id="export-excel" type="button">Excel譖ｸ蜃ｺ</button>
    <button id="new-plan" type="button">・・譁ｰ縺励＞繝励Λ繝ｳ</button>
    <input id="excel-file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
  </header>
  <div class="workspace specs-folded">
    <div id="menu-panel">
      <button type="button" id="fold-menu" class="fold" aria-expanded="true" aria-controls="sidebar">繝代ロ繝ｫ繧帝哩縺倥ｋ</button>
      <aside id="sidebar"></aside>
    </div>
    <main>
      <div class="stage">
        <canvas id="view2d"></canvas>
        <canvas id="view3d" hidden></canvas>
        <canvas id="walk-map" width="200" height="150" hidden aria-label="豁ｩ陦御ｸｭ縺ｮ蟷ｳ髱｢蝗ｳ" title="繧ｯ繝ｪ繝・け縺励◆蝣ｴ謇縺ｸ遘ｻ蜍・></canvas>
        <div class="float-tools" id="float-tools">
          <button type="button" id="fold-tools" class="fold" aria-expanded="true" aria-controls="float-body">髢峨§繧・/button>
          <div id="float-body">
            <div class="tool-group">
              <button type="button" id="mode-2d" class="active">DRAW</button>
              <button type="button" id="mode-3d">3D</button>
            </div>
            <div class="tool-group" id="view-toggle" hidden>
              <button type="button" id="sky" class="active">Sky</button>
              <button type="button" id="walk">Walk</button>
              <button type="button" id="doors" aria-pressed="true">繝峨い繧帝哩縺倥ｋ</button>
            </div>
            <div class="tool-group">
              <button type="button" id="fit">蜈ｨ菴楢｡ｨ遉ｺ</button>
              <button type="button" id="zoom-out">邵ｮ蟆・/button>
              <button type="button" id="zoom-in">諡｡螟ｧ</button>
            </div>
            <div class="tool-group">
              <button type="button" id="undo">蜈・↓謌ｻ縺・/button>
              <button type="button" id="redo">繧・ｊ逶ｴ縺・/button>
              <label class="check"><input id="snap" type="checkbox" checked /> 繧ｹ繝翫ャ繝・/label>
            </div>
          </div>
        </div>
      </div>
    </main>
    <aside id="specs-panel">
      <button type="button" id="fold-specs" class="fold" aria-expanded="false" aria-controls="specs-body">隲ｸ蜈・ｸ隕ｧ</button>
      <div id="specs-body"></div>
    </aside>
  </div>

  <dialog id="dialog-new">
    <form method="dialog" id="form-new">
      <h2>譁ｰ隕上・繝ｩ繝ｳ</h2>
      <label>螟ｩ莠暮ｫ・mm<input name="ceiling" type="number" value="2700" min="2000" max="8000" /></label>
      <label>髫朱ｫ・mm<input name="floorHeight" type="number" value="4000" min="2000" max="12000" /></label>
      <label>螢∝字 mm<input name="wall" type="number" value="150" min="50" max="400" /></label>
      <div class="row">
        <button value="cancel" type="button" id="new-cancel">繧ｭ繝｣繝ｳ繧ｻ繝ｫ</button>
        <button value="ok" type="submit" class="primary">菴懈・</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialog-list" class="thumbs">
    <form method="dialog">
      <h2>繝励Λ繝ｳ荳隕ｧ</h2>
      <div class="plan-list-bar">
        <label>陦ｨ遉ｺ莉ｶ謨ｰ
          <input id="plan-page-size" type="number" min="1" max="60" step="1" value="10" inputmode="numeric" />
        </label>
        <div class="plan-view-switch" role="group" aria-label="陦ｨ遉ｺ縺ｮ蛻・ｊ譖ｿ縺・>
          <button type="button" id="plan-view-list" aria-pressed="false">荳隕ｧ</button>
          <button type="button" id="plan-view-thumb" class="active" aria-pressed="true">繧ｵ繝繝阪う繝ｫ</button>
        </div>
      </div>
      <div id="plan-rows"></div>
      <nav id="plan-pager" class="plan-pager" aria-label="繝壹・繧ｸ"></nav>
      <button id="plan-list-close" value="close" type="submit">髢峨§繧・/button>
    </form>
  </dialog>

  <dialog id="dialog-detail">
    <form method="dialog">
      <h2>繝励Λ繝ｳ隧ｳ邏ｰ</h2>
      <div id="detail-body"></div>
      <div class="row">
        <button type="button" id="detail-columns">陦ｨ遉ｺ險ｭ螳・/button>
        <button type="button" id="print">蜊ｰ蛻ｷ</button>
        <button value="close" type="submit">髢峨§繧・/button>
      </div>
    </form>
  </dialog>

  <dialog id="dialog-detail-columns">
    <form method="dialog">
      <h2>陦ｨ遉ｺ鬆・岼</h2>
      <div id="detail-column-list" class="detail-columns"></div>
      <button value="close" type="submit">髢峨§繧・/button>
    </form>
  </dialog>

  <dialog id="dialog-help">
    <form method="dialog">
      <h2>謫堺ｽ・/h2>
      <button value="close" type="submit">髢峨§繧・/button>
    </form>
  </dialog>

  <div id="print-sheet"></div>
  <script src="vendor/jszip.min.js?v=20261022w"></script>
  <script src="vendor/exceljs.min.js?v=20261022w"></script>
  <script type="module" src="main.js?v=20261113a"></script>
</body>
</html>
